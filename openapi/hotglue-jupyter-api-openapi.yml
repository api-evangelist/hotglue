openapi: 3.2.0
info:
  title: hotglue Jupyter API
  version: '1.2'
servers:
- url: https://api.hotglue.com
security:
- sec0: []
tags:
- name: Jupyter
paths:
  /{env_id}/{flow_id}/{tenant}/jupyter:
    get:
      summary: Retrieve
      description: Linked Sources Jupyter
      operationId: linked-sources-jupyter-retrieve
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      - name: task_arn
        in: query
        description: If provided, will return status for the corresponding Jupyter workspace
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                  - arn: arn://abc
                    status: RUNNING
                    startedAt: '2021-01-01'
                    url: https://sample.myenv.hotglue.xyz/lab?token=abc
                    env_id: myenv.hotglue.xyz
                    flow: abc
                    tap: salesforce
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Jupyter
    post:
      summary: Create
      description: Linked Sources Jupyter
      operationId: linked-sources-jupyter-create
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tap:
                  type: string
                  description: ID of tap to start Jupyter instance for
                jupyter_token:
                  type: string
                  description: Jupyter token – protects your Jupyter session and will be required to connect
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    url: https://sample.myenv.hotglue.xyz/lab
                    task_arn: arn://abc
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: https://sample.myenv.hotglue.xyz/lab
                  task_arn:
                    type: string
                    example: arn://abc
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Jupyter
    delete:
      summary: Delete
      description: Linked Sources Jupyter
      operationId: linked-sources-jupyter-delete
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      - name: task_arn
        in: query
        description: ARN of Jupyter instance to deprovision
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Jupyter
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: x-api-key
x-readme:
  headers: []
  explorer-enabled: true
  proxy-enabled: true
  samples-enabled: true
x-readme-fauxas: true
