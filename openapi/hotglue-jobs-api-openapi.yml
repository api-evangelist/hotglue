openapi: 3.2.0
info:
  title: hotglue Jobs API
  version: '1.2'
servers:
- url: https://api.hotglue.com
security:
- sec0: []
tags:
- name: Jobs
paths:
  /{env_id}/{flow}/{user_id}/jobs/queued:
    get:
      summary: Fetch queued jobs
      description: Returns queued jobs for a specific environment, flow, and user/tenant.
      operationId: queued-jobs-retrieve
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: user_id
        in: path
        description: ID of user/tenant
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    queued_jobs:
                    - id: 101
                      env_id: test-env
                      tenant_id: tenant-123
                      flow_id: customer-sync
                      status: QUEUED
                      created_at: '2026-01-02T03:04:05+00:00'
                      updated_at: '2026-01-02T03:05:06+00:00'
                      job_name: Nightly customer sync
                      override_start_date: '2026-01-01T00:00:00Z'
                      override_end_date: null
                      override_selected_tables:
                        customer: true
                        orders: false
                      override_field_map: null
                      override_env_vars:
                        DEBUG: 'true'
                      override_source_config: null
                      override_target_config: null
                      override_connector_config: null
                      override_lifecycle_webhook:
                        url: https://example.com
                        secret: some-secret
              schema:
                $ref: '#/components/schemas/QueuedJobsResponse'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Jobs
  /{env_id}/jobs/queued:
    get:
      summary: Fetch environment queued jobs
      description: Returns queued jobs for an environment across flows/users.
      operationId: environment-queued-jobs-retrieve
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    queued_jobs:
                    - id: 101
                      env_id: test-env
                      tenant_id: tenant-123
                      flow_id: customer-sync
                      status: QUEUED
                      created_at: '2026-01-02T03:04:05+00:00'
                      updated_at: '2026-01-02T03:05:06+00:00'
                      job_name: Nightly customer sync
                      override_start_date: '2026-01-01T00:00:00Z'
                      override_end_date: null
                      override_selected_tables:
                        customer: true
                        orders: false
                      override_field_map: null
                      override_env_vars:
                        DEBUG: 'true'
                      override_source_config: null
                      override_target_config: null
                      override_connector_config: null
                      override_lifecycle_webhook:
                        url: https://example.com
                        secret: some-secret
              schema:
                $ref: '#/components/schemas/QueuedJobsResponse'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Jobs
  /{env_id}/{flow}/{user_id}/jobs/queued/{queued_job_id}:
    delete:
      summary: Cancel queued job
      description: Cancels a queued job.
      operationId: queued-job-cancel
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: user_id
        in: path
        description: ID of user/tenant
        schema:
          type: string
        required: true
      - name: queued_job_id
        in: path
        description: ID of queued job
        schema:
          oneOf:
          - type: string
          - type: integer
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: 101
                    env_id: test-env
                    tenant_id: tenant-123
                    flow_id: customer-sync
                    status: QUEUED
                    created_at: '2026-01-02T03:04:05+00:00'
                    updated_at: '2026-01-02T03:05:06+00:00'
                    job_name: Nightly customer sync
                    override_start_date: '2026-01-01T00:00:00Z'
                    override_end_date: null
                    override_selected_tables:
                      customer: true
                      orders: false
                    override_field_map: null
                    override_env_vars:
                      DEBUG: 'true'
                    override_source_config: null
                    override_target_config: null
                    override_connector_config: null
                    override_lifecycle_webhook:
                      url: https://example.com
                      secret: some-secret
              schema:
                $ref: '#/components/schemas/QueuedJob'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    Code: BadRequestError
                    Message: Queued job not found
              schema:
                type: object
                properties:
                  Code:
                    type: string
                    example: BadRequestError
                  Message:
                    type: string
                    example: Queued job not found
      deprecated: false
      tags:
      - Jobs
  /{env_id}/{flow_id}/{tenant}/jobs/latest:
    get:
      summary: Get latest job
      description: Fetch the most recent job for a given tenant in a given flow
      operationId: jobs-latest
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    job_id: lmaEbA
                    env_id: dev.example-env.hotglue.xyz
                    job_name: test_job:_V-vgdlLN
                    tenant: default
                    started_by: default
                    flow: l8odS2mce
                    s3_root: default/flows/l8odS2mce/jobs/lmaEbA
                    start_time: '2020-12-30T18:01:01.828266+00:00'
                    state: {}
                    tap: quickbooks:sandbox
                    status: ETL_FAILED
                    message: ETL error...
                    last_updated: '2020-12-30T20:31:00.081282+00:00'
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    example: lmaEbA
                  env_id:
                    type: string
                    example: dev.example-env.hotglue.xyz
                  job_name:
                    type: string
                    example: test_job:_V-vgdlLN
                  tenant:
                    type: string
                    example: default
                  started_by:
                    type: string
                    example: default
                  flow:
                    type: string
                    example: l8odS2mce
                  s3_root:
                    type: string
                    example: default/flows/l8odS2mce/jobs/lmaEbA
                  start_time:
                    type: string
                    example: '2020-12-30T18:01:01.828266+00:00'
                  state:
                    type: object
                    properties: {}
                  tap:
                    type: string
                    example: quickbooks:sandbox
                  status:
                    type: string
                    example: ETL_FAILED
                    enum:
                    - JOB_CREATED
                    - DISCOVER_STARTED
                    - DISCOVER_FAILED
                    - SYNC_STARTED
                    - SYNC_FAILED
                    - SYNC_SUCCESS
                    - ETL_STARTED
                    - ETL_FAILED
                    - ETL_SUCCESS
                    - EXPORT_STARTED
                    - EXPORT_FAILED
                    - JOB_COMPLETED
                  message:
                    type: string
                    example: ETL error...
                  last_updated:
                    type: string
                    example: '2020-12-30T20:31:00.081282+00:00'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Jobs
  /{env_id}/{flow_id}/{tenant}/jobs:
    post:
      summary: Run a V1 job
      description: Kicks off a job for a given tenant. When using the API tap, you can pass a payload in the `state` object to be written to the target. When `queue_if_active_job` is set to true in the request body, hotglue queues the job if another job is already running for the same tenant or flow.
      operationId: jobs-create
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: object
                  description: Pass extra context to be used in the job. Often used with the unified schema for write jobs. Note that this is different from the source state.
                tap:
                  type: string
                  description: The source of the job. For write jobs, this is usually "api."
                job_name:
                  type: string
                  description: Name for job. If not provided, name is autogenerated
                external_job_id:
                  type: string
                  description: External job ID for job. This is used to link the job to an external system.
                override_start_date:
                  type: string
                  description: Date to start syncing data from (e.g. 2022-08-08T00:00:00.000Z)
                  format: date-time
                override_selected_filters:
                  type: object
                  description: Override the selected filters for this job only. Uses the same format as the selected filters configuration and does not affect the saved selection.
                  required:
                  - filters_version
                  - streams
                  properties:
                    filters_version:
                      type: string
                      description: The version of the filters configuration
                    streams:
                      type: object
                      description: The streams and their filters
                      additionalProperties:
                        type: object
                reset_source_state:
                  type: boolean
                  description: Runs the job as a "full_sync" by clearing the `state` on the linkedSource
                streaming_job:
                  type: boolean
                  description: If true, the job will run in streaming mode and skip the ETL step. This feature is in beta.
                override_selected_tables:
                  type: object
                  description: For use with the unified schema. Define a temporary selection of unified schema objects to override the default selection. Does not affect your selection for future jobs. E.G. `{"Vendors":true}`
                override_field_map:
                  type: object
                  description: Define a temporary field map to be used in the job, different from the configured field map.
                override_end_date:
                  type: string
                  description: Date to sync data until (e.g. 2022-08-08T00:00:00.000Z). Note that `end_date` is only supported for certain connectors.
                  format: date-time
                override_source_config:
                  type: object
                  description: Override the source connector configuration for this job only. Does not affect the saved configuration.
                override_target_config:
                  type: object
                  description: Override the target connector configuration for this job only. Does not affect the saved configuration.
                ignore_parallel_jobs:
                  type: boolean
                  description: If true, the job will ignore restrictions on parallel job execution for this connector.
                queue_if_active_job:
                  type: boolean
                  description: If set to true, queues the job when another job is already running for the same tenant or flow. If omitted or set to false, the API returns an error when an active job blocks creation.
                environment_variables:
                  type: object
                  description: Override environment variables for the job execution. Does not affect saved configuration.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    job_id: 37g_DK
                    env_id: mydomain.hotglue.xyz
                    flow_id: l8odS2mce
                    job_name: l8odS2mce-chargebee-20220119-153011
                    external_job_id: asdijsdijasd
                    tenant: '12598713'
                    started_by: '12598713'
                    s3_root: 12598713/flows/l8odS2mce/jobs/2022/01/4/19/15/37g_DK
                    start_time: '2022-01-19T15:30:11.731333+00:00'
                    state: {}
                    tap: chargebee
                    status: JOB_CREATED
                    scheduled_job: true
                    message: '...'
                    last_updated: '2022-01-19T15:35:13.982380+00:00'
                    processed_rows: 0
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    example: 37g_DK
                  env_id:
                    type: string
                    example: mydomain.hotglue.xyz
                  flow_id:
                    type: string
                    example: l8odS2mce
                  job_name:
                    type: string
                    example: l8odS2mce-chargebee-20220119-153011
                  external_job_id:
                    type: string
                    example: asdijsdijasd
                  tenant:
                    type: string
                    example: 12598713
                  started_by:
                    type: string
                    example: 12598713
                  s3_root:
                    type: string
                    example: 12598713/flows/l8odS2mce/jobs/2022/01/4/19/15/37g_DK
                  start_time:
                    type: string
                    example: '2022-01-19T15:30:11.731333+00:00'
                  state:
                    type: object
                    properties: {}
                  tap:
                    type: string
                    example: chargebee
                  status:
                    type: string
                    example: JOB_CREATED
                    enum:
                    - JOB_CREATED
                    - DISCOVER_STARTED
                    - DISCOVER_FAILED
                    - SYNC_STARTED
                    - SYNC_FAILED
                    - SYNC_SUCCESS
                    - ETL_STARTED
                    - ETL_FAILED
                    - ETL_SUCCESS
                    - EXPORT_STARTED
                    - EXPORT_FAILED
                    - JOB_COMPLETED
                  scheduled_job:
                    type: boolean
                    example: true
                    default: true
                  message:
                    type: string
                    example: '...'
                  last_updated:
                    type: string
                    example: '2022-01-19T15:35:13.982380+00:00'
                  processed_rows:
                    type: integer
                    example: 0
                    default: 0
        '202':
          description: Job queued because another job is already running
          content:
            application/json:
              examples:
                Queued Job:
                  value:
                    message: Job has been queued. It will run when available
                    reason: There is a job currently running
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Job has been queued. It will run when available
                  reason:
                    type: string
                    example: There is a job currently running
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Jobs
    get:
      summary: Fetch jobs
      description: Returns a list of job details for a specified tenant. Note that this endpoint does not return raw data fetched in jobs.
      operationId: jobs-retrieve
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      - name: count
        in: query
        description: Number of jobs to return (sorted chronologically)
        schema:
          type: integer
          format: int32
          default: 5
      - name: scheduled
        in: query
        description: Query for scheduled jobs only
        schema:
          type: boolean
      - name: job_type
        in: query
        description: For V2 flows, define whether you fetch "read" or "write" type jobs
        schema:
          type: string
          enum:
          - read
          - write
      - name: page
        in: query
        description: Pagination key used to fetch additional records. Defaults to page=1
        schema:
          type: integer
          format: int32
          default: 1
      - name: from
        in: query
        description: Start date filter (ISO 8601 format)
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: End date filter (ISO 8601 format)
        schema:
          type: string
          format: date
      - name: include_state
        in: query
        description: Include job state in response if true
        schema:
          type: boolean
          default: false
      - name: include_export_details
        in: query
        description: Include export details in response if true
        schema:
          type: boolean
          default: true
      - name: ignore_empty_jobs
        in: query
        description: Ignore jobs with no records processed
        schema:
          type: boolean
          default: false
      - name: sync_type
        in: query
        description: Type of sync
        schema:
          type: string
          enum:
          - incremental_sync
          - auto_sync
          - full_sync
          - real_time_sync
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                  - job_id: lmaEbA
                    env_id: dev.example-env.hotglue.xyz
                    job_name: test_job:_V-vgdlLN
                    tenant: default
                    started_by: default
                    flow: l8odS2mce
                    s3_root: default/flows/l8odS2mce/jobs/lmaEbA
                    start_time: '2020-12-30T18:01:01.828266+00:00'
                    state: {}
                    tap: quickbooks:sandbox
                    status: ETL_FAILED
                    message: ETL error...
                    last_updated: '2020-12-30T20:31:00.081282+00:00'
              schema:
                type: array
                items:
                  type: object
                  properties:
                    job_id:
                      type: string
                      example: lmaEbA
                    env_id:
                      type: string
                      example: dev.example-env.hotglue.xyz
                    job_name:
                      type: string
                      example: test_job:_V-vgdlLN
                    tenant:
                      type: string
                      example: default
                    started_by:
                      type: string
                      example: default
                    flow:
                      type: string
                      example: l8odS2mce
                    s3_root:
                      type: string
                      example: default/flows/l8odS2mce/jobs/lmaEbA
                    start_time:
                      type: string
                      example: '2020-12-30T18:01:01.828266+00:00'
                    state:
                      type: object
                      properties: {}
                    tap:
                      type: string
                      example: quickbooks:sandbox
                    status:
                      type: string
                      example: ETL_FAILED
                      enum:
                      - JOB_CREATED
                      - DISCOVER_STARTED
                      - DISCOVER_FAILED
                      - SYNC_STARTED
                      - SYNC_FAILED
                      - SYNC_SUCCESS
                      - ETL_STARTED
                      - ETL_FAILED
                      - ETL_SUCCESS
                      - EXPORT_STARTED
                      - EXPORT_FAILED
                      - JOB_COMPLETED
                    message:
                      type: string
                      example: ETL error...
                    last_updated:
                      type: string
                      example: '2020-12-30T20:31:00.081282+00:00'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Jobs
  /{env_id}/{flow_id}/{tenant}/jobs/status:
    get:
      summary: Poll job status
      description: Check on the status of a job using exactly one of `job_root`, `job_id`, or `external_job_id`. Read about the possible job statuses here.
      operationId: jobs-status
      parameters:
      - name: job_root
        in: query
        description: S3 root of this job
        required: false
        schema:
          type: string
      - name: job_id
        in: query
        description: ID of this job
        required: false
        schema:
          type: string
      - name: external_job_id
        in: query
        description: External ID of this job
        required: false
        schema:
          type: string
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    job_id: lmaEbA
                    env_id: dev.example-env.hotglue.xyz
                    job_name: test_job:_V-vgdlLN
                    tenant: default
                    started_by: default
                    flow: l8odS2mce
                    s3_root: default/flows/l8odS2mce/jobs/lmaEbA
                    start_time: '2020-12-30T18:01:01.828266+00:00'
                    state: {}
                    tap: quickbooks:sandbox
                    status: ETL_FAILED
                    message: ETL error...
                    last_updated: '2020-12-30T20:31:00.081282+00:00'
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    example: lmaEbA
                  env_id:
                    type: string
                    example: dev.example-env.hotglue.xyz
                  job_name:
                    type: string
                    example: test_job:_V-vgdlLN
                  tenant:
                    type: string
                    example: default
                  started_by:
                    type: string
                    example: default
                  flow:
                    type: string
                    example: l8odS2mce
                  s3_root:
                    type: string
                    example: default/flows/l8odS2mce/jobs/lmaEbA
                  start_time:
                    type: string
                    example: '2020-12-30T18:01:01.828266+00:00'
                  state:
                    type: object
                    properties: {}
                  tap:
                    type: string
                    example: quickbooks:sandbox
                  status:
                    type: string
                    example: ETL_FAILED
                    enum:
                    - JOB_CREATED
                    - DISCOVER_STARTED
                    - DISCOVER_FAILED
                    - SYNC_STARTED
                    - SYNC_FAILED
                    - SYNC_SUCCESS
                    - ETL_STARTED
                    - ETL_FAILED
                    - ETL_SUCCESS
                    - EXPORT_STARTED
                    - EXPORT_FAILED
                    - JOB_COMPLETED
                  message:
                    type: string
                    example: ETL error...
                  last_updated:
                    type: string
                    example: '2020-12-30T20:31:00.081282+00:00'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    Code: Error
                    Message: Invalid job_root supplied - job does not exist!
              schema:
                type: object
                properties:
                  Code:
                    type: string
                    example: Error
                  Message:
                    type: string
                    example: Invalid job_root supplied - job does not exist!
      deprecated: false
      tags:
      - Jobs
  /{env_id}/{flow_id}/{tenant}/jobs/schedule:
    put:
      summary: Create jobs schedule
      description: Create a new schedule for a tenant
      operationId: jobs-schedule
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - schedule_expression
              properties:
                schedule_expression:
                  type: string
                  description: cron expression defining how often sync should occur e.g. `cron(0 0 * * *)`
                job_type:
                  type: string
                  description: For v2 flows, defines the type of job. Accepts "read" or "write."
                  enum:
                  - read
                  - write
                state:
                  type: string
                  description: Whether this schedule should be DISABLED or ENABLED
                  default: ENABLED
                  enum:
                  - DISABLED
                  - ENABLED
                connector_id:
                  type: string
                  description: Optional specific connector or tap ID to set the schedule on
                override_start_date:
                  type: string
                  format: date-time
                  description: Optional override for the `start_date` that jobs will run with. This will ignore state bookmarks and any `start_date` in the config.
                override_selected_tables:
                  type: object
                  description: Override the unified schema selection for this schedule
                override_field_map:
                  type: object
                  description: Override the field map selection for this schedule
                environment_variables:
                  type: object
