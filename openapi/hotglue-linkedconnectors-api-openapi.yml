openapi: 3.2.0
info:
  title: hotglue Linked Connectors API
  version: '1.2'
servers:
- url: https://api.hotglue.com
security:
- sec0: []
tags:
- name: LinkedConnectors
paths:
  /v2/{env_id}/{flow_id}/{tenant}/linkedConnectors:
    get:
      summary: Retrieve linked connector
      description: Fetch the configuration details for a linked connector
      operationId: retrieve-copy
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      - name: config
        in: query
        description: Request the underlying config for the linked source
        schema:
          type: boolean
      - name: catalog
        in: query
        description: Request the catalog of available fields/data to be returned in the payload
        schema:
          type: boolean
      - name: token
        in: query
        description: JWT token generated with your private signing key.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                  - tap: asana
                    domain: asana.com
                    label: Asana
                    tap_url: https://app.asana.com/-/oauth_authorize?response_type=code&client_id=*********
                    auth_url: https://app.asana.com/-/oauth_token
                    icon: https://s3.amazonaws.com/cdn.hotglue.xyz/images/logos/asana.svg
                    type: oauth
                    client_id: '**********'
                    fieldMap:
                      tasks:
                        name: tasks
                        selected:
                        - gid
                        - modified_at
                        - resource_type
                        - name
                        - approval_status
                        - assignee_status
                        - completed
                        - completed_at
                        - completed_by
                        - created_at
                        - dependencies
                        - dependents
                        - due_at
                        - due_on
                        - external
                        - hearted
                        - hearts
                        - html_notes
                        - is_rendered_as_seperator
                        - liked
                        - likes
                        - memberships
                        - notes
                        - num_hearts
                        - num_likes
                        - num_subtasks
                        - resource_subtype
                        - start_on
                        - assignee
                        - custom_fields
                        - followers
                        - parent
                        - permalink_url
                        - projects
                        - tags
                        - workspace
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tap:
                      type: string
                      example: asana
                    domain:
                      type: string
                      example: asana.com
                    label:
                      type: string
                      example: Asana
                    tap_url:
                      type: string
                      example: https://app.asana.com/-/oauth_authorize?response_type=code&client_id=*********
                    auth_url:
                      type: string
                      example: https://app.asana.com/-/oauth_token
                    icon:
                      type: string
                      example: https://s3.amazonaws.com/cdn.hotglue.xyz/images/logos/asana.svg
                    type:
                      type: string
                      example: oauth
                    client_id:
                      type: string
                      example: '**********'
                    fieldMap:
                      type: object
                      properties:
                        tasks:
                          type: object
                          properties:
                            name:
                              type: string
                              example: tasks
                            selected:
                              type: array
                              items:
                                type: string
                                example: gid
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - LinkedConnectors
    post:
      summary: Link a connector
      description: Create a new connection for your tenant, along with an optional schedule and field map, without using the embedded widget.
      operationId: linked-connectors-create
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - connector
              properties:
                connector:
                  type: object
                  description: Connector
                  required:
                  - id
                  properties:
                    id:
                      type: string
                      description: The ID of your connector. You can fetch this from your available or supported connectors
                    config:
                      type: object
                      description: The config object holds key-value pairs with credentials and flags for your connector. These are shared for imports and exports.
                    symlink:
                      type: object
                      description: Symlink allows you to share credentials with a connection from another flow or subtenant
                      properties:
                        id:
                          type: string
                          description: The previously linked flow_id containing a user's credentials
                        tenant:
                          type: string
                          description: Optional. If using subtenants, the tenant id that has the linked connector in the same flow.
                        type:
                          type: string
                          description: Optional. If symlinking from a target flow, pass `target`. Can be left empty for source flows or bidirectional flows.
                          enum:
                          - target
                schedule:
                  type: object
                  description: The schedule expression to sync on
                  properties:
                    schedule_expression:
                      type: string
                      description: CRON expression to set or update the schedule
                    state:
                      type: string
                      enum:
                      - '"ENABLED"'
                      - '"DISABLED'
                field_map:
                  type: object
                  description: The field map to use (if not provided, will use default)
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - LinkedConnectors
    delete:
      summary: Unlink connector
      description: Clear the credentials and configuration for a tenant's linked integration. This cannot be undone.
      operationId: delete-copy
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      - name: connector_id
        in: query
        description: The ID of the connector to unlink
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - LinkedConnectors
    patch:
      summary: Update linked connectors
      description: Modify the field map or change the config for a linked connector
      operationId: update-linked-connectors
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - connector_id
              properties:
                connector_id:
                  type: string
                  description: Name of connector to update
                field_map:
                  type: object
                  description: JSON object representing all fields to pull
                config:
                  type: object
                  description: JSON object containing config values to update
                delete_fields:
                  type: array
                  items:
                    type: string
                  required: false
                  description: List of configuration fields to delete
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - LinkedConnectors
  /v2/{env_id}/{flow_id}/{tenant}/linkedConnectors/discover:
    get:
      summary: Run Discover
      description: Run a discover to generate a `catalog` of available tables and fields
      operationId: linked-connectors-catalog-discover
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      - name: connector_id
        in: query
        description: ID of connector
        required: true
        schema:
          type: string
      - name: v2_source
        in: query
        description: Whether this connector is a v2 source
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: '200'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - LinkedConnectors
  /v2/{env_id}/{flow_id}/{tenant}/linkedConnectors/discover/poll:
    get:
      summary: Poll Discover
      description: Check the status of a running discover. If empty, no discover is currently running.
      operationId: linked-connectors-catalog-poll-discover
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      - name: connector_id
        in: query
        description: ID of connector
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    status: RUNNING
              schema:
                type: object
                properties:
                  status:
                    type:
                    - string
                    - 'null'
                    example: RUNNING
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - LinkedConnectors
  /v2/{env_id}/{flow_id}/{tenant}/linkedConnectors/state:
    get:
      summary: Retrieve connector state
      description: Fetch the current bookmarks for your tenant's linked connector
      operationId: retrieve-connector-state
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      - name: connector_id
        in: query
        description: Name of connector
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    bookmarks:
                      ProfitAndLoss:
                        modified_since: '2021-08-15T14:29:26+00:00'
              schema:
                type: object
                properties:
                  bookmarks:
                    type: object
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - LinkedConnectors
    put:
      summary: Set connector state
      description: Overwrite the connector state with your own bookmarks to re-sync or ignore data
      operationId: set-connector-state
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      - name: connector_id
        in: query
        description: Name of connector to update
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: object
                  description: State object containing bookmark timestamps
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - LinkedConnectors
    delete:
      summary: Delete connector state
      description: Clearing the connector state means that the next job will be a full sync
      operationId: delete-connector-state
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: flow_id
        in: path
        description: ID of flow
        schema:
          type: string
        required: true
      - name: tenant
        in: path
        description: ID of tenant
        schema:
          type: string
        required: true
      - name: connector_id
        in: query
        description: Name of connector to update
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - LinkedConnectors
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: x-api-key
x-readme:
  headers: []
  explorer-enabled: true
  proxy-enabled: true
  samples-enabled: true
x-readme-fauxas: true
