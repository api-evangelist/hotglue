openapi: 3.2.0
info:
  title: hotglue Flows API
  version: '1.2'
servers:
- url: https://api.hotglue.com
security:
- sec0: []
tags:
- name: Flows
paths:
  /{env_id}/flows/supported:
    get:
      summary: Retrieve supported flows
      description: Returns all flows in an environment and their connectors
      operationId: supported-flows-retrieve
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                  - id: cxEkB6bLZ
                    name: Sales
                    description: Sales records from your system
                    taps:
                    - salesforce
                    - hubspot
                    - file
                    targets:
                    - s3
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: cxEkB6bLZ
                    name:
                      type: string
                      example: Sales
                    description:
                      type: string
                      example: Sales records from your system
                    taps:
                      type: array
                      items:
                        type: string
                        example: salesforce
                    targets:
                      type: array
                      items:
                        type: string
                        example: s3
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Flows
  /{env_id}/flows/linked:
    post:
      summary: Create linked flows
      description: Link a flow for a specific tenant
      operationId: linked-flows-create
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - flow
              - user_id
              properties:
                flow:
                  type: string
                  description: ID of flow to link
                user_id:
                  type: string
                  description: ID of tenant
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Flows
    get:
      summary: Retrieve linked flows
      description: Returns the flows that are currently linked for a specific tenant
      operationId: linked-flows-retrieve
      parameters:
      - name: env_id
        in: path
        description: ID of environment
        schema:
          type: string
        required: true
      - name: user_id
        in: query
        description: ID of tenant
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                  - id: cxEkB6bLZ
                    name: Sales
                    description: Sales records from your system
                    taps:
                    - salesforce
                    - hubspot
                    - file
                    targets:
                    - s3
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: cxEkB6bLZ
                    name:
                      type: string
                      example: Sales
                    description:
                      type: string
                      example: Sales records from your system
                    taps:
                      type: array
                      items:
                        type: string
                        example: salesforce
                    targets:
                      type: array
                      items:
                        type: string
                        example: s3
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Flows
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: x-api-key
x-readme:
  headers: []
  explorer-enabled: true
  proxy-enabled: true
  samples-enabled: true
x-readme-fauxas: true
x-provenance:
  method: harvested
  publisher: Hotglue
  source: https://docs.hotglue.com/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
